<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日均成本消费决策计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            max-width: 660px;
            margin: 24px auto;
            padding: 0 16px;
            background-color: #f5f7fa;
        }
        .card {
            background: #fff;
            padding: 20px 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom:16px;
        }
        h1{
            font-size:20px;
            margin-bottom:12px;
            color:#1f2937;
        }
        .row{
            margin:12px 0;
        }
        label{
            display:block;
            margin-bottom:4px;
            font-size:14px;
            color:#4b5563;
        }
        input,select{
            width:100%;
            padding:10px 12px;
            border:1px solid #d1d5db;
            border-radius:8px;
            font-size:15px;
        }
        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            margin-top:8px;
        }
        button:hover{
            background:#1d4ed8;
        }
        .btn-group{
            display:flex;
            gap:6px;
            margin-top:4px;
        }
        .btn-sm{
            width:auto;
            padding:6px 10px;
            margin-top:0;
            font-size:13px;
        }
        .btn-retire{
            background:#16a34a;
        }
        .btn-del{
            background:#dc3545;
        }
        .btn-reset{
            background:#9333ea;
        }
        .result-block{
            margin-top:16px;
            padding:14px;
            border-radius:8px;
        }
        .pass{
            background:#dcfce7;
            color:#166534;
        }
        .fail{
            background:#fee2e2;
            color:#991b1b;
        }
        .tip{
            font-size:13px;
            color:#6b7280;
            margin-top:6px;
        }
        .item-row{
            padding:12px 0;
            border-bottom:1px solid #eee;
        }
        .item-info{
            font-size:14px;
            line-height:1.6;
        }
        .pool-summary{
            padding:12px;
            background:#eff6ff;
            border-radius:8px;
            margin:10px 0;
            font-size:14px;
            line-height:1.8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📦物品记忆列表（本地保存）</h1>
        <div class="row">
            <label>物品名称</label>
            <input type="text" id="itemName" placeholder="例如：手机">
        </div>
        <div class="row">
            <label>购买价格(元)</label>
            <input type="number" id="itemPrice" min="1" placeholder="4200">
        </div>
        <div class="row">
            <label>预估服役时长（年，0.5=半年，最小0.5）</label>
            <input type="number" step="0.5" id="itemYear" min="0.5" value="1" placeholder="1代表1年，3代表3年">
            <div class="tip">0.5=半年、1=1年、2=2年、3=3年；内部自动换算天数</div>
        </div>
        <button onclick="addItem()">添加到池子统计</button>
        <div class="pool-summary" id="poolSummaryWrap">
        </div>
        <div class="btn-group">
            <button class="btn-sm btn-reset" onclick="resetTotalLoss()">重置累计折损额度</button>
        </div>
        <div id="itemListWrap"></div>
    </div>
    <div class="card">
        <h1>日均成本消费决策计算器</h1>
        <div class="row">
            <label>税后月收入（元）</label>
            <input type="number" id="monthIncome" value="8000" min="0">
            <div class="tip">用于平滑自动计算耐用品原始池子上限；月度耐用品预算封顶2100元</div>
        </div>
        <div class="row">
            <label>自定义每日池子上限(元)，留空自动按收入模型计算</label>
            <input type="number" id="poolMax" placeholder="留空自动计算">
        </div>
        <div class="tip">⚠只有达到预定年限自然退役才会释放额度；提前退役产生折损永久扣减，不会自动恢复</div>
    </div>
    <div class="card">
        <h1>待购买商品参数</h1>
        <div class="row">
            <label>商品总价（含配件附加费用，元）</label>
            <input type="number" id="price" min="0" placeholder="例如4200">
        </div>
        <div class="row">
            <label>预估服役时长（年，0.5=半年，最小0.5）</label>
            <input type="number" step="0.5" id="buyYear" min="0.5" value="1" placeholder="3代表3年">
            <div class="tip">和物品录入单位统一，0.5为半年，内部自动换算天数计算日均</div>
        </div>
        <div class="row">
            <label>购买类型</label>
            <select id="buyType">
                <option value="replace">置换更新（旧物功能完好，换新）</option>
                <option value="new">首次刚需新增（旧物报废必须买）</option>
            </select>
            <div class="tip">外观磨损、手感变差不算损坏，一律选置换更新</div>
        </div>
        <button onclick="calc()">开始计算能否购买</button>
        <div id="output"></div>
    </div>
<script>
//物品结构：name,price,year,totalDays,createTs,endTs,daily
// year：服役年数，0.5=半年；1年=364天，0.5年=182天
let itemList = JSON.parse(localStorage.getItem("poolItemList") || "[]");
//累计提前退役折损，永久扣减有效池子；只有到期退役释放额度，折损不会自动回补
let totalLossDaily = Number(localStorage.getItem("totalLossDaily")||"0");

function saveItems(){
    localStorage.setItem("poolItemList", JSON.stringify(itemList));
    localStorage.setItem("totalLossDaily",totalLossDaily.toString());
}
//重置累计折损按钮：手动把折损清零
function resetTotalLoss(){
    if(!confirm("确认重置全部累计提前退役折损？有效池子总额会恢复到原始池子水平，该操作不可撤销！")) return;
    totalLossDaily = 0;
    saveItems();
    renderItemList();
    alert("✅累计折损已全部重置，有效池子恢复原始上限");
}
// 自然到期退役：全额释放额度，无折损
function naturalRetire(idx){
    const item = itemList[idx];
    itemList.splice(idx,1);
    saveItems();
    renderItemList();
    alert(`✅自然到期退役：达到预定服役年限，全额释放 ${item.daily.toFixed(2)} 元/天池子额度，无折损`);
}
//提前手动删除（主观提前退役）：折损永久扣减池子总额，不会自动恢复
function manualEarlyDelete(idx){
    const item = itemList[idx];
    const now = Date.now();
    const create = item.createTs;
    const totalMs = item.endTs - create;
    const passMs = Math.min(now - create, totalMs);
    const consumeRatio = passMs / totalMs;
    const remainRatio = 1 - consumeRatio;
    if(remainRatio <= 0){
        naturalRetire(idx);
        return;
    }
    const lostDaily = item.daily * remainRatio;
    const releaseDaily = item.daily * consumeRatio;
    const rawPoolMax = getRawPoolMaxValue();
    const effectivePoolMax = rawPoolMax - totalLossDaily;
    const currentSum = getSumDaily();
    const msg = `⚠提前退役折算（折损永久扣减，只有到期退役才释放额度，不会自动恢复）
物品【${item.name}】原占池子：${item.daily.toFixed(2)}元/天
实际可释放额度：${releaseDaily.toFixed(2)}元/天
本次新增永久折损：${lostDaily.toFixed(2)}元/天
原始池子上限：${rawPoolMax.toFixed(2)}元/天
累计总折损：${totalLossDaily.toFixed(2)}元/天
扣减后有效池子：${effectivePoolMax.toFixed(2)}元/天
退役前实际占用：${currentSum.toFixed(2)}元/天
退役后实际占用：${(currentSum-releaseDaily).toFixed(2)}元/天
确认执行提前退役？`;
    if(!confirm(msg)) return;
    //累计折损，非到期退役不会自动回补
    totalLossDaily += lostDaily;
    itemList.splice(idx,1);
    saveItems();
    renderItemList();
}

// 根据税后月收入计算耐用品占比（平滑插值）
function getRateByIncome(monthIncome){
    let rate;
    if(monthIncome <= 3000){
        rate = 0.04;
    }else if(monthIncome <=7000){
        //3000~7000：4% →7%线性平滑
        const t = (monthIncome - 3000)/(7000 - 3000);
        rate = 0.04 + t * (0.07 - 0.04);
    }else if(monthIncome <=12000){
        rate = 0.08;
    }else if(monthIncome <=20000){
        rate = 0.10;
    }else if(monthIncome <=35000){
        rate = 0.09;
    }else{
        rate = 0.07;
    }
    return rate;
}

//获取原始池子上限（未扣减折损）
function getRawPoolMaxValue(){
    const monthIncome = Number(document.getElementById('monthIncome').value)||0;
    const poolMaxInput = document.getElementById('poolMax').value;
    let poolMax;
    if(poolMaxInput !=='' && !isNaN(Number(poolMaxInput))){
        poolMax = Number(poolMaxInput);
    }else{
        const rate = getRateByIncome(monthIncome);
        let monthBudget = monthIncome * rate;
        const monthCeiling = 2100;
        monthBudget = Math.min(monthBudget, monthCeiling);
        poolMax = monthBudget / 30;
    }
    return poolMax;
}

//获取有效池子上限（原始 - 累计折损）
function getEffectivePoolMaxValue(){
    return Math.max(0, getRawPoolMaxValue() - totalLossDaily);
}
function getSumDaily(){
    let sumDaily = 0;
    itemList.forEach(it=>sumDaily += it.daily);
    return sumDaily;
}
function renderItemList(){
    const wrap = document.getElementById("itemListWrap");
    wrap.innerHTML = "";
    const sumDaily = getSumDaily();
    const rawPoolMax = getRawPoolMaxValue();
    const effectivePoolMax = getEffectivePoolMaxValue();
    const remainPool = effectivePoolMax - sumDaily;
    //池子总览面板
    const summaryDom = document.getElementById("poolSummaryWrap");
    summaryDom.innerHTML = `
        <div>📊池子总览</div>
        <div>原始池子总额：<strong>${rawPoolMax.toFixed(2)}</strong> 元/天</div>
        <div>累计提前退役折损：<strong style="color:#dc2626;">${totalLossDaily.toFixed(2)}</strong> 元/天</div>
        <div>✅扣折损后有效池子总额：<strong>${effectivePoolMax.toFixed(2)}</strong> 元/天</div>
        <div>当前物品实际占用：<strong>${sumDaily.toFixed(2)}</strong> 元/天</div>
        <div>剩余可用额度：<strong>${remainPool.toFixed(2)}</strong> 元/天</div>
        <div class="tip">💡仅预定年限到期退役才释放额度；提前退役折损不会自动恢复</div>
    `;
    const now = Date.now();
    itemList.forEach((it,idx)=>{
        const remainDay = Math.max(0, Math.ceil((it.endTs - now)/(1000*60*60*24)));
        const createDate = new Date(it.createTs).toLocaleDateString();
        const endDate = new Date(it.endTs).toLocaleDateString();
        const div = document.createElement("div");
        div.className = "item-row";
        div.innerHTML = `
            <div class="item-info">
                <div><strong>${it.name}</strong>｜${it.price}元｜预估${it.year}年(${it.totalDays}天)</div>
                <div>录入:${createDate}｜预期退役:${endDate}｜剩余倒计时:${remainDay}天｜占用池子${it.daily.toFixed(2)}</div>
                <div class="btn-group">
                    <button class="btn-sm btn-retire" onclick="naturalRetire(${idx})">到期退役(全额释放)</button>
                    <button class="btn-sm btn-del" onclick="manualEarlyDelete(${idx})">提前结束(产生永久折损)</button>
                </div>
            </div>
        `;
        wrap.appendChild(div);
    });
}
function addItem(){
    const name = document.getElementById("itemName").value.trim();
    const price = Number(document.getElementById("itemPrice").value);
    const year = Number(document.getElementById("itemYear").value);
    if(!name || price<=0 || year <0.5){
        alert("名称、价格、服役时长必须填写有效数字，最小0.5年");
        return;
    }
    const totalDays = Math.round(year * 364);
    const daily = price / totalDays;
    const createTs = Date.now();
    const endTs = createTs + totalDays * 24 * 60 * 60 * 1000;
    itemList.push({
        name,price,year,totalDays,createTs,endTs,daily
    });
    saveItems();
    renderItemList();
    document.getElementById("itemName").value="";
    document.getElementById("itemPrice").value="";
    document.getElementById("itemYear").value="1";
}
//消费决策主计算
function calc(){
    const existTotal = getSumDaily();
    const effectivePoolMax = getEffectivePoolMaxValue();
    const rawPoolMax = getRawPoolMaxValue();
    const price = Number(document.getElementById('price').value)||0;
    const buyYear = Number(document.getElementById('buyYear').value);
    const buyType = document.getElementById('buyType').value;
    const outputDom = document.getElementById('output');
    if(price <=0 || buyYear <0.5){
        outputDom.innerHTML = `<div class="result-block fail">请填写有效的商品价格与服役时长(最小0.5年)</div>`;
        return;
    }
    const useDays = Math.round(buyYear * 364);
    const itemDaily = price / useDays;
    const sumAfter = existTotal + itemDaily;

    //置换阈值：原始池子 ×22%，下限0.1
    let threshold = Math.max(rawPoolMax * 0.22 , 0.1);

    let canBuy = true;
    let msgList = [];
    msgList.push(`原始池子上限：${rawPoolMax.toFixed(2)}元/天`);
    msgList.push(`累计折损：${totalLossDaily.toFixed(2)}元/天`);
    msgList.push(`✅有效池子上限：${effectivePoolMax.toFixed(2)}元/天`);
    msgList.push(`新商品预估服役：${buyYear}年，折合${useDays}天`);
    msgList.push(`新商品日均成本：${itemDaily.toFixed(2)}元/天`);
    msgList.push(`现有物品合计日均：${existTotal.toFixed(2)}元/天`);
    msgList.push(`购入之后合计：${sumAfter.toFixed(2)}元/天`);
    if(buyType === 'replace'){
        msgList.push(`置换浮动阈值：${threshold.toFixed(2)}元/天（原始池子22%，最低0.1）`);
        if(itemDaily > threshold){
            canBuy = false;
            msgList.push("❌不满足置换阈值条件");
        }else{
            msgList.push("✅满足置换阈值条件");
        }
    }else{
        msgList.push("✅刚需新增，跳过置换阈值校验");
    }
    if(sumAfter > effectivePoolMax){
        canBuy = false;
        msgList.push("❌超出【扣折损后有效池子】总额上限");
    }else{
        msgList.push("✅有效池子额度足够");
    }
    let html = "";
    if(canBuy){
        html += `<div class="result-block pass">✅结论：可以购买<br>`;
    }else{
        html += `<div class="result-block fail">❌结论：不建议购买<br>`;
    }
    html += msgList.join("<br>");
    html += "</div>";
    outputDom.innerHTML = html;
    renderItemList();
}
//监听月收入、自定义池子输入变化，自动刷新池子总览
document.getElementById('monthIncome').addEventListener('input',()=>{
    renderItemList();
});
document.getElementById('poolMax').addEventListener('input',()=>{
    renderItemList();
});
renderItemList();
</script>
</body>
</html>
